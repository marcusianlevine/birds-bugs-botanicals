# Pin the lint surface explicitly so CI doesn't drift when `uvx ruff` pulls a
# newer ruff with different defaults. Both CI lint steps (`ruff check .` from
# pipeline/, `ruff check api` from site/) discover this file by walking up.
target-version = "py312"

[lint]
# E4/E7/E9 + F  -> ruff's historical defaults (keeps the `# noqa: E402` markers
#                  on the sys.path-shimmed API imports meaningful)
# I             -> import sorting
# UP            -> pyupgrade, targeting the py3.12 floor
# B             -> flake8-bugbear (excludes BLE001; blind excepts in the pipeline
#                  error handling are deliberate)
# SIM           -> flake8-simplify
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
