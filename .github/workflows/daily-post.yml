name: Daily post

on:
  schedule:
    # 14:00 UTC daily (10:00 ET / 07:00 PT). GitHub's scheduler can lag a few
    # minutes at peak; adjust the hour to taste.
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      category:
        description: "Force a category (blank = weighted random)"
        type: choice
        options: ["", "bird", "bug", "botanical"]
        default: ""
      mode:
        description: "photo (default) or video"
        type: choice
        options: ["photo", "video"]
        default: "photo"
      dry_run:
        description: "Dry run — generate only, post nothing"
        type: boolean
        default: false

# Never let two runs post at once; queue instead of cancelling.
concurrency:
  group: daily-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    env:
      # Content generation
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      # Required by pipeline/config.py at import time (even with --no-tiktok)
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      # Instagram Graph API
      INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
      INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
      # Optional: birds fall back to fewer photo sources without this
      EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
      # Optional: only used by --mode video
      WAVESPEED_API_KEY: ${{ secrets.WAVESPEED_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pipeline/uv.lock"

      - name: Install dependencies
        run: uv sync

      - name: Build pipeline args
        id: args
        run: |
          # TODO(tiktok): once the TikTok app passes audit, drop `--no-tiktok`
          # here AND add the repo secret TIKTOK_PRIVACY_LEVEL=PUBLIC_TO_EVERYONE
          # (config.py defaults it to SELF_ONLY, so without it every TikTok post
          # publishes as private). Also add TIKTOK_ACCESS_TOKEN to the job env.
          args="--no-tiktok"
          [ "${{ inputs.dry_run }}" = "true" ] && args="$args --dry-run"
          [ "${{ inputs.mode }}" = "video" ] && args="$args --mode video"
          [ -n "${{ inputs.category }}" ] && args="$args --category ${{ inputs.category }}"
          echo "value=$args" >> "$GITHUB_OUTPUT"

      - name: Run pipeline
        # INSTAGRAM_ACCESS_TOKEN comes from the job-level env (the stored
        # secret). A long-lived token is valid for 60 days; the maintenance
        # step further down keeps that window from lapsing. Posting no longer
        # depends on a live OAuth refresh call succeeding first.
        run: uv run python main.py ${{ steps.args.outputs.value }}

      - name: Commit updated pipeline state
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posted_history.json data/rejected_species.json data/species_pools.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "chore: update pipeline state [skip ci]"

          # The post already went out by now, so losing this commit means the
          # next run works from stale state (and can re-post a species). Retry
          # the rebase-onto-remote + push a few times to ride out a concurrent
          # push landing in the gap between pull and push.
          branch="${{ github.ref_name }}"
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase --autostash origin "$branch"; then
              git rebase --abort 2>/dev/null || true
              echo "Rebase failed on attempt $attempt; retrying in 10s..."
              sleep 10
              continue
            fi
            if git push origin "HEAD:$branch"; then
              echo "State committed and pushed (attempt $attempt)."
              exit 0
            fi
            echo "Push attempt $attempt failed (likely a concurrent push); retrying in 10s..."
            sleep 10
          done

          echo "::error::Could not push updated pipeline state after 5 attempts."
          exit 1

      - name: Refresh + persist Instagram token (maintenance)
        # Token upkeep, deliberately run *after* the post. The stored secret is
        # a valid 60-day token that the run above already posted with; this only
        # extends the window. --min-days-left 14 makes it a no-op (no OAuth call,
        # no `gh secret set`) until the token is within two weeks of expiring, so
        # repo secrets are touched ~monthly and a failure here is a rare, visible
        # event rather than a daily one that's silently masked.
        id: ig_refresh
        if: ${{ inputs.dry_run != true }}
        continue-on-error: true
        run: uv run python instagram_auth.py --refresh --min-days-left 14

      - name: Push refreshed token to repo secrets
        # Only runs on the ~monthly occasions the step above actually refreshed.
        # Intentionally NOT continue-on-error: if a new token was minted but we
        # can't persist it, that should fail loudly.
        if: ${{ steps.ig_refresh.outputs.access_token != '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
          NEW_TOKEN: ${{ steps.ig_refresh.outputs.access_token }}
        run: gh secret set INSTAGRAM_ACCESS_TOKEN --body "$NEW_TOKEN"

      - name: Upload run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output-${{ github.run_id }}
          path: pipeline/output/
          if-no-files-found: ignore
          retention-days: 14
